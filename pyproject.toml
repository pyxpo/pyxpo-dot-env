[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxpo-dot-env"
dynamic = ["version"]
description = "Environment variables for pyxpo apps: .env files per build mode, typed access, and a build-time guard that stops secrets from shipping inside the app."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vishal Chaubey" }]
keywords = ["pyxpo", "pyxpo-module", "mobile", "android", "ios", "dotenv", "env", "environment-variables", "secrets", "config"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Android",
    "Operating System :: iOS",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
requires-python = ">=3.9"
dependencies = ["pyxpo>=0.1.0a4,<0.2"]

[project.urls]
Homepage = "https://github.com/pyxpo/pyxpo-env"
Documentation = "https://github.com/pyxpo/pyxpo-env#readme"
Changelog = "https://github.com/pyxpo/pyxpo-dot-env/blob/main/CHANGELOG.md"
Source = "https://github.com/pyxpo/pyxpo-env"
Issues = "https://github.com/pyxpo/pyxpo-dot-env/issues"

# How `pyxpo build` finds this module: the entry point name is the module name apps list in
# `[tool.pyxpo] modules`, its value the import package holding pyxpo-module.json.
[project.entry-points."pyxpo.modules"]
dot-env = "pyxpo_dot_env"

[tool.setuptools]
packages = ["pyxpo_dot_env"]

[tool.setuptools.dynamic]
version = { attr = "pyxpo_dot_env.__version__" }

[tool.setuptools.package-data]
pyxpo_dot_env = ["pyxpo-module.json", "py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", ".DS_Store"]
